name: Full Flutter CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
    - "docs/**"
    - "README.md"
  push:
    branches:
      - master
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "README.md"
      - "res/**"
      - "appimage/**"
      - "flatpak/**"

jobs:
  run-ci:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/flutter-build.yml
    secrets:
      SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
      SINTEC_SERVER_ADDRESS: ${{ secrets.SINTEC_SERVER_ADDRESS }}
      SINTEC_SERVER_PUBLIC_KEY: ${{ secrets.SINTEC_SERVER_PUBLIC_KEY }}
    with:
      upload-artifact: false
